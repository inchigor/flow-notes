<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quick Capture</title>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/quick-capture.css">
  </head>
  <body>
    <form id="captureForm" class="capture-shell">
      <div id="captureHeader" class="capture-header" title="Move window">
        <img src="/flow-notes.png" width="20" height="20" alt="">
        <span>Quick Capture</span>
        <button id="dismissCapture" class="capture-close" type="button" title="Dismiss" aria-label="Dismiss">
          <svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#x"></use></svg>
        </button>
      </div>
      <textarea
        id="captureInput"
        rows="3"
        placeholder="Write a note…"
        aria-label="Write a note"
        aria-describedby="captureHint"
        autofocus
      ></textarea>
      <div class="capture-footer">
        <span id="captureWordCount" class="word-count">0 words</span>
        <button id="saveCapture" class="capture-save" type="submit" title="Save note" aria-label="Save note" disabled>
          <svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#arrow-up"></use></svg>
        </button>
      </div>
      <p id="captureHint" class="sr-only">Enter to save · Shift+Enter for new line · Esc to dismiss</p>
    </form>
    <script src="/quick-capture.js"></script>
  </body>
</html>
