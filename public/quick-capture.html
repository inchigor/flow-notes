<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quick Capture</title>
    <link rel="stylesheet" href="/quick-capture.css">
  </head>
  <body>
    <form id="captureForm" class="capture-shell">
      <textarea
        id="captureInput"
        rows="3"
        placeholder="Write a note…"
        autofocus
      ></textarea>
      <p class="capture-hint">Enter to save · Shift+Enter for new line · Esc to dismiss</p>
    </form>
    <script src="/quick-capture.js"></script>
  </body>
</html>
